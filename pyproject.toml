[project]
name = "hyjy-standalone"
version = "1.0.0"
description = "会议纪要助手 Agent 独立部署版（DeepSeek + Tavily）"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.22.1",
    "chardet==5.2.0",
    "docx2python==3.5.0",
    "fastapi==0.121.2",
    "langchain==1.0.3",
    "langchain-core==1.0.2",
    "langchain-openai==1.0.1",
    "langgraph==1.0.2",
    "langgraph-checkpoint==3.0.0",
    "langgraph-checkpoint-sqlite==3.0.1",
    "langgraph-prebuilt==1.0.2",
    "openpyxl==3.1.5",
    "pandas==2.2.2",
    "pydantic==2.12.3",
    "pypdf==6.4.1",
    "python-docx==1.2.0",
    "python-dotenv==1.2.1",
    "python-pptx==1.0.2",
    "requests==2.32.5",
    "uvicorn==0.38.0",
]

[tool.uv]
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
